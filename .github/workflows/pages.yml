name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/journal3d/package-lock.json

      # The journal is a separate Vite app: React + three.js are bundled into
      # one ES module and the page pulls it in with a dynamic import.
      - name: Build the 3D journal
        working-directory: src/journal3d
        run: npm ci && npm run build

      - name: Collect the site
        run: |
          rm -rf journal3d
          cp -r dist/journal3d journal3d
          ls -la journal3d

      # Creates the Pages site for this repo if it does not exist yet, so no
      # manual "Settings -> Pages" step is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
